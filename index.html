<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성우별 최애캐 취향표 메이커</title>
    <!-- HTML2Canvas 라이브러리 (이미지 저장용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Cropper.js 라이브러리 (이미지 자르기용) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <style>
        :root {
            --primary-color: #e0f2fe;
            --secondary-color: #38bdf8;
            --hover-color: #0ea5e9;
            --text-color: #0369a1;
            --bg-color: #f0f9ff;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }

        .controls label {
            font-weight: bold;
            color: var(--text-color);
        }

        .controls input[type="number"], .controls input[type="text"] {
            width: 60px;
            padding: 5px;
            border: 2px solid var(--secondary-color);
            border-radius: 6px;
            text-align: center;
        }

        .controls input.title-input {
            width: 180px;
            text-align: left;
        }

        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--hover-color);
        }

        .btn-reset {
            background-color: #fb7185 !important;
        }
        .btn-reset:hover {
            background-color: #f43f5e !important;
        }

        /* 모바일 자동 줌아웃 및 스크롤 래퍼 */
        .table-outer-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding-bottom: 20px;
        }

        /* 캡처 영역 스타일 */
        #capture-area {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(56, 189, 248, 0.15);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 3px solid var(--secondary-color);
            min-width: max-content;
            transform-origin: top center;
        }

        .table-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }

        .table-rows-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row-item {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .seongwoo-container {
            width: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        /* 성우 사진 칸 (동그라미) */
        .seongwoo-cell {
            width: 70px;
            height: 70px;
            background-color: #f8fafc;
            border: 2px dashed #bae6fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .seongwoo-cell:hover {
            border-color: var(--secondary-color);
            background-color: var(--primary-color);
        }

        .seongwoo-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .move-btns {
            display: flex;
            gap: 4px;
        }

        .move-btns button {
            width: 31px;
            height: 20px;
            font-size: 10px;
            padding: 0;
            background-color: #bae6fd;
            color: #0369a1;
            border-radius: 4px;
        }

        .move-btns button:hover {
            background-color: var(--secondary-color);
            color: white;
        }

        .cells-row {
            display: flex;
            gap: 8px;
        }

        .participant-name-input {
            width: 70px;
            height: 35px;
            border: 2px solid var(--secondary-color);
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-color);
            background-color: #fff;
            padding: 0 4px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .participant-name-input:focus {
            outline: none;
            background-color: var(--primary-color);
        }

        /* 캐릭터 사진 칸 (직사각형) */
        .grid-cell {
            width: 70px;
            height: 70px;
            background-color: #f8fafc;
            border: 2px dashed #bae6fd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        .grid-cell:hover {
            border-color: var(--secondary-color);
            background-color: var(--primary-color);
        }

        .grid-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .watermark {
            margin-top: 15px;
            font-size: 13px;
            color: #0284c7;
            font-weight: bold;
            align-self: flex-end;
        }

        .hidden-file-input {
            display: none;
        }

        /* 이미지 자르기 모달창 디자인 */
        #cropperModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .cropper-content-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .cropper-image-container {
            width: 100%;
            max-height: 350px;
            margin-bottom: 15px;
            overflow: hidden;
        }

        .cropper-image-container img {
            max-width: 100%;
        }

        .cropper-btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .cropper-btn-group button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
        }

        .btn-cancel {
            background-color: #94a3b8 !important;
        }
        .btn-cancel:hover {
            background-color: #64748b !important;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div>
            <label for="titleText">상단 이름:</label>
            <input type="text" id="titleText" class="title-input" value="성우별 최애캐 취향표" oninput="updateTitle(); saveData();">
        </div>
        <div>
            <label for="colCount">캐릭터 칸(가로):</label>
            <input type="number" id="colCount" value="5" min="1" max="8" onchange="createGrid(true)">
        </div>
        <div>
            <label for="rowCount">성우 칸(세로):</label>
            <input type="number" id="rowCount" value="5" min="1" max="10" onchange="createGrid(true)">
        </div>
        <button onclick="saveImage()" style="background-color: #0284c7;">이미지 저장하기</button>
        <button class="btn-reset" onclick="resetAllData()">전체 초기화</button>
    </div>

    <div class="table-outer-wrapper" id="outerWrapper">
        <div id="capture-area">
            <div class="table-title" id="displayTitle">성우별 최애캐 취향표</div>
            <div id="tableRowsContainer" class="table-rows-container"></div>
            <div class="watermark">@bbong_bbong9</div>
        </div>
    </div>

    <!-- 이미지 자르기 모달 팝업 -->
    <div id="cropperModal">
        <div class="cropper-content-box">
            <h3 style="margin-top: 0; color: var(--text-color); font-size: 16px;">사진 위치 및 크기 조절</h3>
            <div class="cropper-image-container">
                <img id="cropperImage" src="" alt="Crop Source">
            </div>
            <div class="cropper-btn-group">
                <button class="btn-cancel" onclick="closeCropperModal()">취소</button>
                <button onclick="applyCrop()">완료</button>
            </div>
        </div>
    </div>

    <!-- 파일 업로드를 위한 숨겨진 인풋 -->
    <input type="file" id="fileInput" class="hidden-file-input" accept="image/*" onchange="handleFileSelect(event)">

    <script>
        let activeCell = null;
        let cropper = null;

        function updateTitle() {
            const titleInput = document.getElementById('titleText').value;
            document.getElementById('displayTitle').innerText = titleInput || ' ';
        }

        function autoZoomTable() {
            const captureArea = document.getElementById('capture-area');
            const outerWrapper = document.getElementById('outerWrapper');
            
            captureArea.style.transform = 'none';
            
            const areaWidth = captureArea.offsetWidth;
            const availableWidth = outerWrapper.clientWidth - 20;

            if (areaWidth > availableWidth) {
                const scale = availableWidth / areaWidth;
                captureArea.style.transform = `scale(${scale})`;
                captureArea.style.marginBottom = `-${(captureArea.offsetHeight * (1 - scale))}px`;
            } else {
                captureArea.style.transform = 'none';
                captureArea.style.marginBottom = '0px';
            }
        }

        function createGrid(isUserChanged = false) {
            const colsInput = document.getElementById('colCount');
            const rowsInput = document.getElementById('rowCount');
            
            let cols = parseInt(colsInput.value) || 5;
            let rows = parseInt(rowsInput.value) || 5;

            let savedData = null;
            if (!isUserChanged) {
                const loaded = localStorage.getItem('voicePrefData');
                if (loaded) {
                    try {
                        savedData = JSON.parse(loaded);
                        if (savedData.title) {
                            document.getElementById('titleText').value = savedData.title;
                            updateTitle();
                        }
                        if (savedData.cols) cols = savedData.cols;
                        if (savedData.rows) rows = savedData.rows;
                        colsInput.value = cols;
                        rowsInput.value = rows;
                    } catch (e) {
                        console.error(e);
                    }
                }
            }
            
            const tableRowsContainer = document.getElementById('tableRowsContainer');
            tableRowsContainer.innerHTML = '';

            const nameRowItem = document.createElement('div');
            nameRowItem.className = 'row-item';

            const nameSpacer = document.createElement('div');
            nameSpacer.className = 'seongwoo-container';
            nameSpacer.style.visibility = 'hidden';
            nameRowItem.appendChild(nameSpacer);

            const namesRow = document.createElement('div');
            namesRow.className = 'cells-row';

            for (let c = 0; c < cols; c++) {
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'participant-name-input';
                nameInput.placeholder = '이름';
                if (savedData && savedData.names && savedData.names[c]) {
                    nameInput.value = savedData.names[c];
                }
                nameInput.oninput = saveData;
                namesRow.appendChild(nameInput);
            }
            nameRowItem.appendChild(namesRow);
            tableRowsContainer.appendChild(nameRowItem);

            for (let r = 0; r < rows; r++) {
                const rowItem = document.createElement('div');
                rowItem.className = 'row-item';

                const swContainer = document.createElement('div');
                swContainer.className = 'seongwoo-container';

                const swCell = document.createElement('div');
                swCell.className = 'seongwoo-cell';
                if (savedData && savedData.seongwooImages && savedData.seongwooImages[r]) {
                    const img = document.createElement('img');
                    img.src = savedData.seongwooImages[r];
                    swCell.appendChild(img);
                }
                swCell.onclick = function() {
                    activeCell = swCell;
                    document.getElementById('fileInput').click();
                };
                swContainer.appendChild(swCell);

                const moveBtns = document.createElement('div');
                moveBtns.className = 'move-btns';

                const upBtn = document.createElement('button');
                upBtn.innerHTML = '▲';
                upBtn.title = '위로 이동';
                upBtn.onclick = function(e) {
                    e.stopPropagation();
                    moveRow(r, -1);
                };

                const downBtn = document.createElement('button');
                downBtn.innerHTML = '▼';
                downBtn.title = '아래로 이동';
                downBtn.onclick = function(e) {
                    e.stopPropagation();
                    moveRow(r, 1);
                };

                moveBtns.appendChild(upBtn);
                moveBtns.appendChild(downBtn);
                swContainer.appendChild(moveBtns);

                rowItem.appendChild(swContainer);

                const charsRow = document.createElement('div');
                charsRow.className = 'cells-row';

                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    if (savedData && savedData.gridImages && savedData.gridImages[r] && savedData.gridImages[r][c]) {
                        const img = document.createElement('img');
                        img.src = savedData.gridImages[r][c];
                        cell.appendChild(img);
                    }
                    cell.onclick = function() {
                        activeCell = cell;
                        document.getElementById('fileInput').click();
                    };
                    charsRow.appendChild(cell);
                }

                rowItem.appendChild(charsRow);
                tableRowsContainer.appendChild(rowItem);
            }

            if (!isUserChanged) {
                saveData();
            }

            setTimeout(autoZoomTable, 50);
        }

        window.onresize = function() {
            autoZoomTable();
        };

        function moveRow(index, direction) {
            const rowsInput = document.getElementById('rowCount');
            const rows = parseInt(rowsInput.value) || 5;
            const targetIndex = index + direction;

            if (targetIndex < 0 || targetIndex >= rows) return;

            saveData();
            const loaded = JSON.parse(localStorage.getItem('voicePrefData'));

            const tempSw = loaded.seongwooImages[index];
            loaded.seongwooImages[index] = loaded.seongwooImages[targetIndex];
            loaded.seongwooImages[targetIndex] = tempSw;

            const tempGrid = loaded.gridImages[index];
            loaded.gridImages[index] = loaded.gridImages[targetIndex];
            loaded.gridImages[targetIndex] = tempGrid;

            localStorage.setItem('voicePrefData', JSON.stringify(loaded));
            createGrid(true);
        }

        function saveData() {
            const cols = parseInt(document.getElementById('colCount').value) || 5;
            const rows = parseInt(document.getElementById('rowCount').value) || 5;
            const title = document.getElementById('titleText').value;

            const nameInputs = document.querySelectorAll('.participant-name-input');
            const names = Array.from(nameInputs).map(input => input.value);

            const seongwooCells = document.querySelectorAll('.seongwoo-cell');
            const seongwooImages = Array.from(seongwooCells).map(cell => {
                const img = cell.querySelector('img');
                return img ? img.src : null;
            });

            const rowItems = document.querySelectorAll('.row-item');
            const gridImages = [];
            for (let r = 0; r < rows; r++) {
                const rowElem = rowItems[r + 1];
                if (!rowElem) continue;
                const cells = rowElem.querySelectorAll('.grid-cell');
                gridImages[r] = [];
                cells.forEach((cell, c) => {
                    const img = cell.querySelector('img');
                    gridImages[r][c] = img ? img.src : null;
                });
            }

            const data = {
                title,
                cols,
                rows,
                names,
                seongwooImages,
                gridImages
            };

            localStorage.setItem('voicePrefData', JSON.stringify(data));
        }

        // 파일 선택 시 자르기 모달 띄우기
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && activeCell) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const cropperImage = document.getElementById('cropperImage');
                    cropperImage.src = e.target.result;
                    
                    document.getElementById('cropperModal').style.display = 'flex';

                    if (cropper) {
                        cropper.destroy();
                    }

                    cropper = new Cropper(cropperImage, {
                        aspectRatio: 1, // 1:1 정사각형 비율 고정
                        viewMode: 1,
                        dragMode: 'move',
                        autoCropArea: 0.9,
                        restore: false,
                        guides: true,
                        center: true,
                        highlight: false,
                        cropBoxMovable: true,
                        cropBoxResizable: true,
                        toggleDragModeOnDblclick: false,
                    });
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        // 자르기 완료 버튼
        function applyCrop() {
            if (cropper && activeCell) {
                const canvas = cropper.croppedCanvas ? cropper.croppedCanvas : cropper.getCroppedCanvas({
                    width: 200,
                    height: 200
                });

                if (canvas) {
                    const existingImg = activeCell.querySelector('img');
                    if (existingImg) {
                        existingImg.remove();
                    }
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/png');
                    activeCell.appendChild(img);
                    saveData();
                }
                closeCropperModal();
            }
        }

        // 자르기 취소 버튼
        function closeCropperModal() {
            document.getElementById('cropperModal').style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
        }

        function resetAllData() {
            if (confirm("정말로 모든 작성 내용과 이미지를 초기화하시겠습니까?")) {
                localStorage.removeItem('voicePrefData');
                document.getElementById('titleText').value = "성우별 최애캐 취향표";
                document.getElementById('colCount').value = 5;
                document.getElementById('rowCount').value = 5;
                updateTitle();
                createGrid(true);
            }
        }

        function saveImage() {
            const captureArea = document.getElementById('capture-area');
            const originalTransform = captureArea.style.transform;
            
            captureArea.style.transform = 'none';
            
            html2canvas(captureArea, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                captureArea.style.transform = originalTransform;
                
                const link = document.createElement('a');
                link.download = 'voice_actor_preference.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(() => {
                captureArea.style.transform = originalTransform;
            });
        }

        window.onload = function() {
            createGrid(false);
        };
    </script>

</body>
</html>
