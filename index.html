<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성우별 최애캐 취향표 메이커</title>
    <!-- HTML2Canvas 라이브러리 (이미지 저장용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-color: #e0f2fe;
            --secondary-color: #38bdf8;
            --hover-color: #0ea5e9;
            --text-color: #0369a1;
            --bg-color: #f0f9ff;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            background: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .controls label {
            font-weight: bold;
            color: var(--text-color);
        }

        .controls input[type="number"], .controls input[type="text"] {
            width: 60px;
            padding: 5px;
            border: 2px solid var(--secondary-color);
            border-radius: 6px;
            text-align: center;
        }

        .controls input.title-input {
            width: 180px;
            text-align: left;
        }

        button {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--hover-color);
        }

        /* 캡처 영역 스타일 */
        #capture-area {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(56, 189, 248, 0.15);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border: 3px solid var(--secondary-color);
        }

        .table-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 10px;
            text-align: center;
            min-width: 200px;
        }

        /* 참여자 이름 칸들이 들어갈 가로 정렬 영역 */
        .name-row {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .participant-name-input {
            width: 70px;
            height: 35px;
            border: 2px solid var(--secondary-color);
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-color);
            background-color: #fff;
            padding: 0 4px;
            box-sizing: border-box;
        }

        .participant-name-input:focus {
            outline: none;
            background-color: var(--primary-color);
        }

        .table-rows-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .row-item {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* 성우 사진 칸 (동그라미) */
        .seongwoo-cell {
            width: 70px;
            height: 70px;
            background-color: #f8fafc;
            border: 2px dashed #bae6fd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .seongwoo-cell:hover {
            border-color: var(--secondary-color);
            background-color: var(--primary-color);
        }

        .seongwoo-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .characters-row {
            display: flex;
            gap: 8px;
        }

        /* 캐릭터 사진 칸 (직사각형) */
        .grid-cell {
            width: 70px;
            height: 70px;
            background-color: #f8fafc;
            border: 2px dashed #bae6fd;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .grid-cell:hover {
            border-color: var(--secondary-color);
            background-color: var(--primary-color);
        }

        .grid-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .watermark {
            margin-top: 15px;
            font-size: 13px;
            color: #0284c7;
            font-weight: bold;
            align-self: flex-end;
        }

        .hidden-file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div>
            <label for="titleText">상단 이름:</label>
            <input type="text" id="titleText" class="title-input" value="성우별 최애캐 취향표" oninput="updateTitle()">
        </div>
        <div>
            <label for="colCount">캐릭터 칸(가로):</label>
            <input type="number" id="colCount" value="5" min="1" max="8" onchange="createGrid()">
        </div>
        <div>
            <label for="rowCount">성우 칸(세로):</label>
            <input type="number" id="rowCount" value="5" min="1" max="10" onchange="createGrid()">
        </div>
        <button onclick="createGrid()">표 새로고침</button>
        <button onclick="saveImage()" style="background-color: #0284c7;">이미지 저장하기</button>
    </div>

    <!-- 캡처될 메인 영역 -->
    <div id="capture-area">
        <div class="table-title" id="displayTitle">성우별 최애캐 취향표</div>
        
        <!-- 제목 바로 아래 가로로 배치되는 참여자 이름 입력 칸 영역 -->
        <div id="nameRowContainer" class="name-row"></div>

        <!-- 행별 구성 영역 (성우 동그라미 칸 + 캐릭터 칸들) -->
        <div id="tableRowsContainer" class="table-rows-container"></div>

        <div class="watermark">@bbong_bbong9</div>
    </div>

    <!-- 파일 업로드를 위한 숨겨진 인풋 -->
    <input type="file" id="fileInput" class="hidden-file-input" accept="image/*" onchange="handleFileSelect(event)">

    <script>
        let activeCell = null;

        function updateTitle() {
            const titleInput = document.getElementById('titleText').value;
            document.getElementById('displayTitle').innerText = titleInput || ' ';
        }

        function createGrid() {
            const cols = parseInt(document.getElementById('colCount').value) || 5;
            const rows = parseInt(document.getElementById('rowCount').value) || 5;
            
            const nameRowContainer = document.getElementById('nameRowContainer');
            const tableRowsContainer = document.getElementById('tableRowsContainer');
            
            nameRowContainer.innerHTML = '';
            tableRowsContainer.innerHTML = '';

            // 0. 정렬을 맞추기 위해 왼쪽 성우 칸 크기(70px)와 간격(8px)만큼의 빈 공간(Spacer) 추가
            const spacer = document.createElement('div');
            spacer.style.width = '70px';
            nameRowContainer.appendChild(spacer);

            // 1. 가로 칸 수만큼 제목 아래에 참여자 이름 입력 칸 생성
            for (let c = 0; c < cols; c++) {
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'participant-name-input';
                nameInput.placeholder = '이름';
                nameRowContainer.appendChild(nameInput);
            }

            // 2. 세로 줄(성우 수)만큼 행 생성
            for (let r = 0; r < rows; r++) {
                const rowItem = document.createElement('div');
                rowItem.className = 'row-item';

                // 성우 사진 칸 (동그라미)
                const swCell = document.createElement('div');
                swCell.className = 'seongwoo-cell';
                swCell.onclick = function() {
                    activeCell = swCell;
                    document.getElementById('fileInput').click();
                };
                rowItem.appendChild(swCell);

                // 캐릭터 칸들 (직사각형)을 감싸는 컨테이너
                const charsRow = document.createElement('div');
                charsRow.className = 'characters-row';

                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell';
                    cell.onclick = function() {
                        activeCell = cell;
                        document.getElementById('fileInput').click();
                    };
                    charsRow.appendChild(cell);
                }

                rowItem.appendChild(charsRow);
                tableRowsContainer.appendChild(rowItem);
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file && activeCell) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const existingImg = activeCell.querySelector('img');
                    if (existingImg) {
                        existingImg.remove();
                    }
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    activeCell.appendChild(img);
                };
                reader.readAsDataURL(file);
            }
            event.target.value = '';
        }

        function saveImage() {
            const captureArea = document.getElementById('capture-area');
            
            html2canvas(captureArea, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'voice_actor_preference.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        window.onload = function() {
            createGrid();
        };
    </script>

</body>
</html>
